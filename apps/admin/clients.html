<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin Clients</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body><div class="admin-shell"><aside class="side"><img src="logo.png"><a href="index.html">Dashboard</a><a class="active" href="clients.html">Clients</a><a href="messages.html">Messages</a><a href="settings.html">Settings</a><a href="#" data-logout>Log Out</a></aside><section><header class="topbar"><h1 data-t="clients">Clients</h1><select class="lang-select" data-lang style="position:absolute;right:14px"></select></header><main class="container admin-content"><div class="card"><div class="toolbar"><input id="search" class="light-input search" placeholder="Search clients"><span class="pill" id="count">0</span></div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Credit</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></section></div><script src="config.js"></script>
<script type="module">import {init,api} from './scripts/common.js';if(init()){let all=[];const render=()=>{const q=search.value.toLowerCase();const list=all.filter(x=>(x.name+x.phone).toLowerCase().includes(q));count.textContent=list.length;rows.innerHTML=list.map(x=>`<tr><td>${x.name}</td><td>${x.phone}</td><td><span class="pill ${x.status==='active'?'success':'danger'}">${x.status}</span></td><td>${x.creditScore}</td><td><button class="btn ${x.status==='active'?'danger':'gold'}" data-id="${x.id}">${x.status==='active'?'Suspend':'Activate'}</button></td></tr>`).join('');rows.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const c=all.find(x=>x.id===b.dataset.id);await api('/admin/clients/'+c.id,{method:'PATCH',body:JSON.stringify({status:c.status==='active'?'suspended':'active'})});all=await api('/admin/clients');render()})};all=await api('/admin/clients');render();search.oninput=render}</script><script src="/shared/scripts/responsive.js" defer></script></body></html>
