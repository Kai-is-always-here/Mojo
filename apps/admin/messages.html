<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Messages</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body><div class="admin-shell"><aside class="side"><img src="logo.png"><a href="index.html">Dashboard</a><a href="clients.html">Clients</a><a class="active" href="messages.html">Messages</a><a href="settings.html">Settings</a><a href="#" data-logout>Log Out</a></aside><section><header class="topbar"><h1>Messages</h1></header><main class="container admin-content"><div class="card"><div class="toolbar"><select id="clientId" class="light-input"></select><button id="refresh" class="btn secondary">Refresh</button></div><div id="messages" class="message-list" style="margin-top:16px"></div><form id="send" class="chat-form" style="margin-top:16px"><textarea id="text" class="light-input" rows="3" placeholder="Message client..."></textarea><input id="file" type="file" accept="image/*,.pdf,.txt,.zip"><div class="chat-actions"><span id="fileName" class="muted"></span><button class="btn" type="submit">Send</button></div></form></div></main></section></div><script src="config.js"></script>
<script type="module">import {init,api} from './scripts/common.js';if(init()){let clients=[];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const apiBase=url=>(window.BO_CONFIG?.API_BASE||localStorage.getItem('bo_api')||'/api')+url;const loadClients=async()=>{clients=await api('/admin/clients');clientId.innerHTML=clients.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.phone)}</option>`).join('')||'<option value="">No clients</option>';await load()};const load=async()=>{if(!clientId.value){messages.innerHTML='<div class="empty">Select a client.</div>';return}const list=await api('/messages/admin?clientId='+encodeURIComponent(clientId.value));messages.innerHTML=list.map(m=>`<div class="message ${m.fromRole==='admin'?'mine':''}"><b>${m.fromRole==='admin'?'You':'Client'}</b><p>${esc(m.text)}</p>${m.attachment?`<a class="attachment" target="_blank" href="${apiBase(m.attachment.url)}">📎 ${esc(m.attachment.name)}</a>`:''}<small>${new Date(m.createdAt).toLocaleString()}</small></div>`).join('')||'<div class="empty">No messages yet.</div>'};clientId.onchange=load;refresh.onclick=load;file.onchange=()=>fileName.textContent=file.files[0]?.name||'';send.onsubmit=async e=>{e.preventDefault();const f=file.files[0];let fileData=null;if(f){if(f.size>8*1024*1024){alert('Maximum file size is 8 MB.');return}fileData=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}try{await api('/messages/admin',{method:'POST',body:JSON.stringify({clientId:clientId.value,text:text.value,fileData,fileName:f?.name||''})});text.value='';file.value='';fileName.textContent='';await load()}catch(e){alert(e.message)}};await loadClients()}}</script></body></html>
