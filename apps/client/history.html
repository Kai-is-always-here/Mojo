<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080c"><title>BoxOffice — History</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body data-active="history"><div class="app-shell"><header class="topbar"><select class="lang-select" data-lang aria-label="Language"></select><h1 data-t="history">History</h1></header><main class="container page"><section class="card"><div class="toolbar"><div class="grid grid-3" style="flex:1"><button class="btn" data-filter="all" type="button">All</button><button class="btn secondary" data-filter="pending" type="button">Pending</button><button class="btn secondary" data-filter="completed" type="button">Completed</button></div><button id="refreshHistory" class="btn secondary" type="button">Refresh</button></div></section><section id="historyList" style="display:grid;gap:12px;margin-top:14px"><div class="empty">Loading history…</div></section></main><div id="nav"></div></div><script src="config.js"></script><script type="module">
import {initLang,api,guard,nav} from './scripts/common.js';
const user=guard('client');
if(user){
  initLang(); document.getElementById('nav').innerHTML=nav('history');
  let items=[],filter='all'; const list=document.getElementById('historyList');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const render=()=>{const view=filter==='all'?items:items.filter(x=>x.status===filter);list.innerHTML=view.map(x=>`<article class="card"><div class="section-head"><div><h3 style="margin:0 0 5px">${esc(x.title||'Order')}</h3><span class="muted">${new Date(x.createdAt).toLocaleString()}</span></div><span class="pill ${x.status==='completed'?'success':x.status==='cancelled'?'danger':''}">${esc(x.status)}</span></div><div class="grid grid-2" style="margin-top:12px"><div><span class="kpi">Amount</span><b style="display:block">$${Number(x.amount||0).toFixed(2)}</b></div><div><span class="kpi">Commission</span><b style="display:block">$${Number(x.commissionAmount||0).toFixed(2)}</b></div></div></article>`).join('')||'<div class="empty">No history records found.</div>'};
  const load=async()=>{try{items=await api('/client/history');render()}catch(e){list.innerHTML=`<div class="notice">${esc(e.message)}</div>`}};
  document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('secondary',x!==b));render()}));
  refreshHistory.addEventListener('click',load); await load();
}
</script><script src="/shared/scripts/responsive.js" defer></script></body></html>
