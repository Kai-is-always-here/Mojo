<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BoxOffice — Login</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body class="auth-page"><main class="auth-layout"><header class="auth-brand"><img src="logo.png" class="auth-logo" alt="BoxOffice"><div class="auth-brand-title">BOXOFFICE</div><div class="auth-brand-subtitle">Professional Data Optimization Services</div></header><section class="auth-box" aria-labelledby="loginTitle"><div class="auth-tools"><a class="icon-btn" href="support.html" aria-label="Customer Service" title="Customer Service"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 16 0v4a2 2 0 0 1-2 2h-2v-5h4M4 13H2v3a2 2 0 0 0 2 2h2v-5H4m5 4h2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 19c.8 1 1.9 1.5 3 1.5 1.1 0 2.2-.5 3-1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></a><button class="icon-btn" type="button" id="languageBtn" aria-label="Language" title="Language"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c2.4 2.5 3.4 5.5 3.4 9S14.4 18.5 12 21M12 3C9.6 5.5 8.6 8.5 8.6 12s1 6.5 3.4 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button><select class="lang-select auth-language" data-lang aria-label="Language"></select></div><h1 id="loginTitle" class="auth-title" data-t="welcome">Hello! Welcome</h1><p class="auth-sub" data-t="subtitle">We provide professional data optimization services</p><form id="loginForm" novalidate><div class="field"><label data-t="phone">Phone Number</label><input class="input" name="email" type="text" inputmode="tel" autocomplete="username" placeholder="Phone Number" data-i18n-placeholder="phone" required></div><div class="field"><label data-t="password">Password</label><input class="input" name="password" type="password" autocomplete="current-password" required></div><div id="msg" class="auth-message" role="alert" aria-live="polite"></div><button class="btn" type="submit" data-t="login">Login Now</button></form><p class="auth-switch"><a href="register.html" data-t="register">Register</a></p></section></main><script src="config.js"></script><script type="module" src="scripts/auth.js"></script><script>document.getElementById('languageBtn')?.addEventListener('click',()=>document.querySelector('[data-lang]')?.focus());</script></body></html>
