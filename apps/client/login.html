<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BoxOffice — Client Login</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"><link rel="stylesheet" href="shared/auth/slideshow.css"></head><body class="auth-page"><div data-auth-slideshow data-poster-base="shared/auth/" aria-hidden="true"></div><main class="auth-layout"><button class="trailer-sound" type="button" data-trailer-sound hidden aria-pressed="false">🔇 Sound</button><header class="auth-topbar"><a class="icon-btn" href="support.html" aria-label="Customer Service" title="Customer Service"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 16 0v4a2 2 0 0 1-2 2h-2v-5h4M4 13H2v3a2 2 0 0 0 2 2h2v-5H4m5 4h2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 19c.8 1 1.9 1.5 3 1.5 1.1 0 2.2-.5 3-1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></a><div class="brand-stack"><img src="logo.png" class="auth-logo" alt="BoxOffice logo"><div class="auth-brand-title">BOXOFFICE</div><div class="auth-brand-subtitle">Professional Data Optimization Services</div></div><button class="icon-btn" type="button" id="languageBtn" aria-label="Language" title="Language"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c2.4 2.5 3.4 5.5 3.4 9S14.4 18.5 12 21M12 3C9.6 5.5 8.6 8.5 8.6 12s1 6.5 3.4 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button><select class="lang-select" data-lang aria-label="Language"></select></header><section class="auth-box" aria-labelledby="loginTitle"><h1 id="loginTitle" class="auth-title" data-t="welcome">Hello! Welcome</h1><p class="auth-sub" data-t="subtitle">We provide professional data optimization services</p><form id="loginForm" novalidate><div class="field"><label data-t="phone">Phone Number</label><input class="input" name="email" type="text" inputmode="tel" autocomplete="username" placeholder="Type your number" data-i18n-placeholder="phone" required></div><div class="field"><label data-t="password">Password</label><div class="password-wrap"><input id="passwordInput" class="input" name="password" type="password" autocomplete="current-password" placeholder="....." required><button class="password-toggle" type="button" data-password-toggle aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6"/></svg></button></div></div><div class="auth-options"><label class="remember"><input id="rememberMe" type="checkbox"> <span>Remember me</span></label><a class="forgot-link" href="support.html?topic=password">Forgot password?</a></div><div id="msg" class="auth-message" role="alert" aria-live="polite"></div><button class="btn" type="submit" data-t="login">Login Now</button></form></section><p class="auth-switch">New to BoxOffice? <a href="register.html" data-t="register">Register</a></p></main><script src="config.js"></script><script type="module" src="shared/auth/slideshow.js"></script><script type="module" src="scripts/auth.js"></script><script>const lb=document.getElementById('languageBtn'),ls=document.querySelector('[data-lang]');lb?.addEventListener('click',()=>{if(ls?.showPicker)ls.showPicker();else ls?.focus()});const pt=document.querySelector('[data-password-toggle]'),pi=document.getElementById('passwordInput');pt?.addEventListener('click',()=>{const hidden=pi.type==='password';pi.type=hidden?'text':'password';pt.setAttribute('aria-label',hidden?'Hide password':'Show password')});</script></body></html>
