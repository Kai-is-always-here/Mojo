<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080c"><title>BoxOffice — Start</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body data-active="start"><div class="app-shell"><header class="topbar"><select class="lang-select" data-lang aria-label="Language"></select><h1 data-t="start">Starting</h1></header><main class="container page"><section class="card"><h2>Start a Task</h2><p class="muted">Create a new order. Your assigned administrator can review and complete it.</p><form id="orderForm"><div class="field"><label for="title">Task title</label><input id="title" class="light-input" name="title" maxlength="160" placeholder="Example: Movie data optimization" required></div><div class="field"><label for="amount">Order amount (USD)</label><input id="amount" class="light-input" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="10.00" required></div><button id="submitOrder" class="btn" type="submit">Create Task</button><div id="orderMsg" class="notice" style="display:none;margin-top:12px" role="status"></div></form></section><section class="card" style="margin-top:14px"><div class="section-head"><h2 style="margin:0">Account Summary</h2><button id="refreshSummary" class="btn secondary" type="button">Refresh</button></div><div class="grid grid-4" style="margin-top:14px"><div class="stat"><span class="kpi">Tasks</span><b id="taskCount">0 / 30</b></div><div class="stat"><span class="kpi">Asset Balance</span><b id="assetBalance">$0.00</b></div><div class="stat"><span class="kpi">Daily Profit</span><b id="dailyProfit">$0.00</b></div><div class="stat"><span class="kpi">Commission</span><b id="commission">$0.00</b></div></div></section></main><div id="nav"></div></div><script src="config.js"></script><script type="module">
import {initLang,api,guard,nav} from './scripts/common.js';
const user=guard('client');
if(user){
  initLang();
  document.getElementById('nav').innerHTML=nav('start');
  const msg=document.getElementById('orderMsg');
  const form=document.getElementById('orderForm');
  const submit=document.getElementById('submitOrder');
  const show=(text,ok=true)=>{msg.textContent=text;msg.style.display='block';msg.style.background=ok?'#eefaf2':'#fff0f0';msg.style.borderColor=ok?'#bfe8cc':'#ffd1d1'};
  const load=async()=>{try{const d=await api('/client/dashboard');taskCount.textContent=`${d.stats.taskCount} / ${d.stats.totalTasks}`;assetBalance.textContent=`$${Number(d.stats.assetBalance||0).toFixed(2)}`;dailyProfit.textContent=`$${Number(d.stats.dailyProfit||0).toFixed(2)}`;commission.textContent=`$${Number(d.stats.commission||0).toFixed(2)}`}catch(e){show(e.message,false)}};
  form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;try{const data=Object.fromEntries(new FormData(form));const created=await api('/orders/client',{method:'POST',body:JSON.stringify({title:data.title,amount:Number(data.amount)})});show(`Task created successfully. Status: ${created.status}.`,true);form.reset();await load()}catch(e){show(e.message,false)}finally{submit.disabled=false}});
  refreshSummary.addEventListener('click',load);
  await load();
}
</script><script src="/shared/scripts/responsive.js" defer></script></body></html>
