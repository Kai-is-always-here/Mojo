<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Customer Service</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body data-active="profile"><div class="app-shell"><header class="topbar"><select class="lang-select" data-lang></select><h1 data-t="customer">Customer Service</h1><span class="status-dot">● Online</span></header><main class="container page"><section class="notice-card"><b>Service</b><span>Your account support is available here.</span></section><section class="card chat-card"><div id="messages" class="message-list"></div><form id="send" class="chat-form"><textarea id="text" class="light-input" rows="3" placeholder="Write a message..."></textarea><input id="file" type="file" accept="image/*,.pdf,.txt,.zip"><div class="chat-actions"><span id="fileName" class="muted"></span><button class="btn" type="submit" data-t="send">Send</button></div></form></section></main><div id="nav"></div></div><script src="config.js"></script>
<script type="module">import {guard,api,apiForm,nav} from './scripts/common.js';const u=guard('client');if(u){navEl.innerHTML=nav('profile');const render=async()=>{const list=await api('/messages/client');messages.innerHTML=list.map(m=>{const a=m.attachment?`<a class="attachment" href="${apiBase(m.attachment.url)}" target="_blank">📎 ${m.attachment.name}</a>`:'';return `<div class="message ${m.fromRole==='client'?'mine':''}"><b>${m.fromRole==='client'?'You':'Service'}</b><p>${escapeHtml(m.text||'')}</p>${a}<small>${new Date(m.createdAt).toLocaleString()}</small></div>`}).join('')||'<div class="empty">No messages yet.</div>'};const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const apiBase=url=>(window.BO_CONFIG?.API_BASE||localStorage.getItem('bo_api')||'/api')+url;file.onchange=()=>fileName.textContent=file.files[0]?.name||'';send.onsubmit=async e=>{e.preventDefault();const f=file.files[0];let fileData=null;if(f){if(f.size>8*1024*1024){alert('Maximum file size is 8 MB.');return}fileData=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}try{await apiForm('/messages/client',{text:text.value,fileData,fileName:f?.name||''});text.value='';file.value='';fileName.textContent='';await render()}catch(e){alert(e.message)}};await render()};</script><script>const navEl=document.getElementById('nav');</script></body></html>
