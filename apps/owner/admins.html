<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner — Admins</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body><header class="topbar"><h1>Admin Management</h1></header><main class="container owner-content"><nav class="owner-nav"><a href="index.html">Overview</a><a class="active" href="admins.html">Admins</a><a href="clients.html">Clients</a><a href="settings.html">Settings</a><a href="#" data-logout>Log Out</a></nav><div class="grid grid-2"><section class="card"><h2>Create Admin</h2><form id="create"><div class="field"><label>Name</label><input class="light-input" name="name" required></div><div class="field"><label>Email</label><input class="light-input" name="email" type="email" required></div><div class="field"><label>Password</label><input class="light-input" name="password" type="password" minlength="8" required></div><button class="btn">Create Admin</button><div id="result" style="margin-top:12px"></div></form></section><section class="card"><h2>Administrators</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Invite Code</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script src="config.js"></script>
<script type="module">import {init,api} from './scripts/common.js';if(init()){const load=async()=>{const d=await api('/owner/overview');rows.innerHTML=d.admins.map(a=>`<tr><td>${a.name}</td><td>${a.email}</td><td><span class="badge-code">${a.inviteCode}</span></td><td><span class="pill ${a.status==='active'?'success':'danger'}">${a.status}</span></td><td><button class="btn danger" data-delete="${a.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No admins yet.</td></tr>';rows.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const a=d.admins.find(x=>x.id===b.dataset.delete);if(!confirm(`Delete admin ${a.name}? This will also delete that admin's clients and messages.`))return;await api('/owner/admins/'+a.id,{method:'DELETE'});await load()})};await load();create.onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/admins',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(create)))});result.innerHTML=`<div class="notice">Admin created. Invitation code: <b class="badge-code">${d.inviteCode}</b></div>`;create.reset();await load()}catch(x){result.textContent=x.message}}}}</script></body></html>
