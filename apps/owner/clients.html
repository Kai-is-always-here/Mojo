<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner — Clients</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body><header class="topbar"><h1>All Clients</h1></header><main class="container owner-content"><nav class="owner-nav"><a href="index.html">Overview</a><a href="admins.html">Admins</a><a class="active" href="clients.html">Clients</a><a href="settings.html">Settings</a><a href="#" data-logout>Log Out</a></nav><section class="card"><div class="toolbar"><input id="search" class="light-input search" placeholder="Search clients"></div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Name</th><th>Phone</th><th>Admin</th><th>Status</th><th>Credit</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="config.js"></script>
<script type="module">import {init,api} from './scripts/common.js';if(init()){let d=await api('/owner/overview');let admins=Object.fromEntries(d.admins.map(a=>[a.id,a.name]));let list=d.clients;const render=()=>{const q=search.value.toLowerCase();rows.innerHTML=list.filter(c=>(c.name+c.phone).toLowerCase().includes(q)).map(c=>`<tr><td>${c.name}</td><td>${c.phone}</td><td>${admins[c.adminId]||'—'}</td><td>${c.status}</td><td>${c.creditScore}</td><td><button class="btn danger" data-delete="${c.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">No clients yet.</td></tr>';rows.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const c=list.find(x=>x.id===b.dataset.delete);if(!confirm(`Delete client ${c.name}? This permanently removes the client and their messages.`))return;await api('/owner/clients/'+c.id,{method:'DELETE'});d=await api('/owner/overview');admins=Object.fromEntries(d.admins.map(a=>[a.id,a.name]));list=d.clients;render()})};render();search.oninput=render}}</script></body></html>
