<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Owner — Settings</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body><header class="topbar"><h1>System Settings</h1></header><main class="container owner-content"><nav class="owner-nav"><a href="index.html">Overview</a><a href="admins.html">Admins</a><a href="clients.html">Clients</a><a class="active" href="settings.html">Settings</a><a href="#" data-logout>Log Out</a></nav><section class="card"><form id="settings"><div class="field"><label>Site Name</label><input class="light-input" name="siteName"></div><div class="field"><label>Default Language</label><select class="light-input" name="defaultLanguage"></select></div><label class="row"><input type="checkbox" name="maintenance"> Maintenance mode</label><div style="margin-top:16px"><button class="btn" data-t="save">Save</button></div><div id="msg" style="margin-top:12px"></div></form></section></main><script src="config.js"></script>
<script type="module">import {init,api} from './scripts/common.js';import {LANGUAGES} from './shared/i18n/translations.js';if(init()){const f=settings;f.defaultLanguage.innerHTML=LANGUAGES.map(([c,n])=>`<option value="${c}">${n}</option>`).join('');const d=await api('/owner/overview');f.siteName.value=d.settings.siteName;f.defaultLanguage.value=d.settings.defaultLanguage;f.maintenance.checked=d.settings.maintenance;f.onsubmit=async e=>{e.preventDefault();await api('/owner/settings',{method:'PATCH',body:JSON.stringify({siteName:f.siteName.value,defaultLanguage:f.defaultLanguage.value,maintenance:f.maintenance.checked})});msg.textContent='Settings saved.'}}}</script><script src="/shared/scripts/responsive.js" defer></script></body></html>
