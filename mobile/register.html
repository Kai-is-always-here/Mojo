<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><link rel="icon" href="/assets/favicon.ico"><link rel="stylesheet" href="/mobile/style.css"><title>BoxOffice — Register</title></head><body data-role="client"><div class="backdrop"></div><main class="screen"><header class="topbar"><a class="top-btn" href="/service.html" aria-label="Service">SERVICE</a><div class="brand"><img class="logo" src="/assets/logo.png" alt="BoxOffice logo"><div class="brand-sub">PROFESSIONAL DATA OPTIMIZATION SERVICES</div><div class="switch">Already registered? <a href="/login">LOGIN</a></div></div><button class="top-btn" type="button" onclick="document.documentElement.lang=document.documentElement.lang==='en'?'my':'en'" aria-label="Language">LANG</button></header><section class="card"><h1>Client Register</h1><form id="authForm" data-register="true"><div class="field"><label>Name</label><input class="input" name="name" autocomplete="name" required></div><div class="field"><label>Phone Number</label><input class="input" name="phone" type="tel" autocomplete="tel" required></div><div class="field"><label>Password</label><input class="input" name="password" type="password" autocomplete="new-password" required></div><div class="field"><label>Confirm Password</label><input class="input" name="confirmPassword" type="password" autocomplete="new-password" required></div><div class="field"><label>Withdrawal Password</label><input class="input" name="withdrawalPassword" type="password" autocomplete="new-password" required></div><div class="field"><label>Invitation Code</label><input class="input" name="inviteCode" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" required></div><div class="switch"><input type="checkbox" required> I accept Terms &amp; Conditions</div><div id="msg" class="msg"></div><button class="btn" type="submit">Register</button></form></section></main><script src="/apps/client/config.js"></script><script type="module" src="/mobile/app.js"></script></body></html>
